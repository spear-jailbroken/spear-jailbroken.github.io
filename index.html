<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jail/broken · SPEAR Conference (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;0,800;1,400&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#161616; --bg2:#1f1f1f; --ink:#f4f4f4; --mute:#b0b0b0; --rule:#3a3a3a;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --pix:"VT323","JetBrains Mono",ui-monospace,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--mono);-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 56px}
header{padding-bottom:24px;border-bottom:2px solid #c961ff}
.prompt{color:var(--mute);font-size:13px;margin:0 0 18px;overflow-wrap:anywhere}
.logo{display:block;max-width:60%;height:auto;margin:0 0 22px}
h1{font:400 clamp(64px,19vw,128px)/.85 var(--pix);letter-spacing:.02em;margin:0 0 14px;color:#fff;word-break:break-all}
.tag{margin:0 0 22px;color:var(--mute);font-size:15px}
.facts{display:grid;gap:4px;margin:0 0 22px;font-weight:700}
.facts span:first-child{color:#c961ff}
.btn{display:inline-block;background:#c961ff;color:#161616;font:800 16px var(--mono);padding:13px 22px;text-decoration:none;border-radius:3px}
.btn:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}
.open{margin:16px 0 0;font-style:italic;color:var(--mute);font-size:14px}
h2{font:700 14px var(--mono);color:var(--mute);margin:34px 0 14px}
.s{--c:#fff;border-left:5px solid var(--c);background:var(--bg2);padding:16px 18px 18px;margin:0 0 14px;border-radius:0 4px 4px 0}
.s.now{outline:2px solid var(--c);outline-offset:3px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;color:var(--c);font-weight:700;font-size:14px}
.kind{color:var(--mute);font-weight:400}
.badge{background:var(--c);color:#161616;padding:0 8px;border-radius:2px;font-weight:800}
h3{font:800 clamp(24px,6.4vw,34px)/1.1 var(--mono);color:var(--c);margin:8px 0 6px}
.sub{font-weight:700;margin:0 0 10px}
.d{margin:0 0 14px;color:#dcdcdc;font-size:15px;max-width:66ch}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:14px;font-weight:700;font-size:15px;line-height:1.35}
li details{margin-top:6px;font-weight:400}
li summary{cursor:pointer;color:var(--c);font-size:13px;font-weight:700}
li .bio{margin-top:6px;font-size:14px;line-height:1.55;color:var(--mute)}
li .bio p{margin:0 0 8px}
li img{flex:none;width:64px;height:64px;object-fit:cover;border:2px solid var(--c);border-radius:3px}
li small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.break{border-left:5px dashed var(--rule);padding:8px 18px;margin:0 0 14px;color:var(--mute);font-size:14px}
footer{margin-top:40px;padding-top:20px;border-top:2px solid var(--rule);color:var(--mute);font-size:13px}
footer p{margin:0 0 12px}
.thanks{text-align:center}
.sponsors{display:flex;flex-wrap:wrap;gap:20px 28px;align-items:center;justify-content:center;margin:0 0 24px}
.sponsors img{display:block;max-width:100%;height:auto}
</style>
</head>

var S=[
{t:"10:00",e:"10:30",k:"Keynote",c:"#c961ff",h:"ijeoma oluo",sub:"Keynote address (via Zoom)",
 d:"Black communities have been watched, tracked, and policed since the advent of slavery. Oluo traces the throughline from the earliest surveillance of Black people to today’s data systems, and the patterns that have driven it across eras.",
 p:[["Ijeoma Oluo","New York Times bestselling author of So You Want to Talk About Race"]]},
{t:"10:35",e:"12:00",k:"Panel",c:"#ff8a2b",h:"who gets watched?",sub:"Surveillance and the broader arc of fascism",
 d:"Unrest over FLOCK cameras and data collection by private surveillance corporations like Palantir focuses on the technology, but not the forces driving their propagation. What are those forces, and how do they interact with the current political moment?",
 p:[["Yeshimabeit Milner","Executive director and co-founder, Data for Black Lives"],["Aly Wane","Immigrant human rights organizer, Syracuse Peace Council"],["Naomi Murakawa","Associate professor of African American Studies, Princeton University"]]},
{t:"12:05",e:"12:35",k:"Chat",c:"#8ef09a",h:"reconnecting",sub:"A chat with Eddie Ellis",
 d:"What happens when someone returns home after a prison sentence to a world that has gone digital without them? Ellis shares his experience with digital literacy and the other technological barriers faced by reentering citizens.",
 p:[["Olinda Moyd","Board vice president, The Sentencing Project"],["Eddie Ellis","Co-director of outreach and community care, Campaign for the Fair Sentencing of Youth"]]},
{brk:"Lunch",t:"12:35",e:"13:30"},
{t:"13:35",e:"15:00",k:"Panel",c:"#f05a5a",h:"plates, pings, and probable cause",sub:"The infrastructure of surveillance",
 d:"This panel looks at how the surveillance state functions, from plate readers to FLOCK cameras: which technologies the state uses to watch us, how they work, and how they shape who ends up in prison.",
 p:[["Beryl Lipton","Senior investigative researcher, Electronic Frontier Foundation"],["Albert Fox Cahn","Founder-in-residence, Surveillance Technology Oversight Project (S.T.O.P.)"],["Udi Ofer","Professor of Public and International Affairs, Princeton University"]]},
{t:"15:05",e:"15:30",k:"Workshop",c:"#f08cc4",h:"can we trust what we see?",sub:"Body-worn cameras to cell phone recordings",
 d:"An interactive workshop on the use of AI and technology in court cases. Build a framework for critiquing video evidence and weigh its shifting importance under surveillance capitalism.",
 p:[["Maya Dimant","Assistant Professor of Law and Director of Public Interest & Externships, Seton Hall University School of Law"]]},
{t:"15:35",e:"16:30",k:"Panel",c:"#5dd0fa",h:"e-carceration",sub:"Incarceration beyond walls",
 d:"From probation to alternatives to detention, the carceral state is increasingly integrating monitoring technologies. How does “e-carceration” help mitigate, or perpetuate, the racial inequities baked into the criminal legal system?",
 p:[["Olinda Moyd","Board vice president, The Sentencing Project"],["Joseph Barrett","Program director, Manhattan Justice Opportunities"]]},
{t:"16:30",e:"18:00",k:"Panel and workshop",c:"#ffe56b",h:"protecting dissenters",sub:"Cross-movement frameworks for movement defense",
 d:"State counterinsurgency, from domestic terror frameworks like NSPM-7 to ICE detention and deportation, targets dissenters and anyone deemed “other.” Organizers share tested tools for keeping ourselves safe against the surveillance state.",
 p:[["Matyos Kidane","Community organizer, founding member of NOCAPP"],["Jamila Hammami","Community organizer, border abolitionist scholar-activist, co-founder of Resistant Communiqués Podcast"],["Taylor Fox","Legal Fellow, Knight First Amendment Institute at Columbia University"]]},
{brk:"Dinner",t:"18:00",e:"19:00"}
];

var B={"Albert Fox Cahn": ["Albert Fox Cahn is the Surveillance Technology Oversight Project’s (S.T.O.P.’s) founder in residence; a Practitioner-in-Residence at Cambridge University’s Centre of Governance and Human Rights and N.Y.U Law School’s Information Law Institute; and a fellow at Ashoka, and TED.", "As a lawyer, technologist, and activist, Albert has become a leading voice on how to govern and build the technologies of the future. He started S.T.O.P. with the belief that local surveillance is an unprecedented threat to public safety, equity, and democracy.", "Albert is a frequent commentator, with more than 100 articles in the New York Times, Boston Globe, Guardian, WIRED, Slate, NBC Think, Newsweek, and other publications. His TED Talk has been viewed hundreds of thousands of times. He frequently lectures at leading universities and speaks at leading technology governance forums. Albert previously served as an associate at Weil, Gotshal & Manges LLP, where he advised Fortune 50 companies on technology policy, antitrust law, and consumer privacy.", "Albert also serves on the New York Immigration Coalition’s Immigrant Leaders Council, IEEE Standards Association P3119 AI Procurement Working Group, and is an editorial board member for the Anthem Ethics of Personal Data Collection. He was also a founding member of the New York Immigrant Freedom Fund’s Advisory Council. Albert received his J.D., cum laude, from Harvard Law School (where he was an editor of the Harvard Law & Policy Review), and his B.A. in Politics and Philosophy from Brandeis University."], "Olinda Moyd": ["Olinda Moyd is a social justice champion who has dedicated her legal career to disrupting the machinery of mass incarceration through her practice in prisoners’ rights, parole, post- conviction, resentencing, and reentry. Her fight to liberate individuals from carceral systems reverberates throughout her journey as an attorney, professor, consultant, and community activist. As a Decarceration Attorney, she currently provides individual post-conviction representation, engages in legislative advocacy, and supports grassroots organizations through movement lawyering.", "She served as Director of the Decarceration and Re-Entry Clinic at the American University Washington College of Law from July 2022 to June 2025. She supervised student attorneys who represented individuals who had served decades in prison and advocated for their release before the court or the parole commission. The clinic also helped people rebuild connections and reestablish support as they restarted their lives upon reentry. Olinda was previously an Adjunct Professor and Supervising Attorney for the Re-Entry Clinic at the Howard University School of Law from August 2020 to June 2022. Before joining the Howard Law faculty, Professor Moyd was Chief Attorney of the Parole Division at the Public Defender Service for the District of Columbia, where she was employed for three decades (1990 – 2020). During the first few years, she served as a prisoners’ rights attorney, filing individual and class action conditions litigation on behalf of individuals sentenced in D.C. courts. She then focused on parole litigation and provided direct representation to numerous individuals at administrative hearings and in proceedings in the D.C. Superior Court and the United States District Court. She also facilitated skills training seminars for the CJA Bar, the DC Bar Association, the judiciary, and local law firms.", "Professor Moyd has a passion for expanding legal education through clinical pedagogy, especially focused on resentencing and reentry, both locally and abroad. She has trained and supervised clinical students enrolled in the Georgetown University Law Center, and she was a Visiting Professor at the University of the District of Columbia, David A. Clarke School of Law, teaching the Prisoner’s Rights and Advocacy Clinic. Professor Moyd also serves on the Law Clinic Kuje Prison Advisory Committee with several other law school clinicians, which provides mentorship and guidance to the Pretrial Detention Reform Project in Nigeria. Her current work in Nigeria includes her service on the Clinical Legal Education Standard and Evaluation Committee. She currently serves on several boards, including The Sentencing Project, The D.C. Council for Court Excellence, The Maryland Alliance for Justice Reform, and The Second Look Project, and she was recently appointed by Governor Wes Moore to serve on the Advisory Board for the Maryland Office of the Correctional Ombudsman. Her most recent publication, The Slow Drip of Decarceration: Reversing the Flood of Mass Incarceration and Its Racist Impact, Volume 23, Number 2, University of Maryland Law Journal of Race, Religion, Gender and Class (2024), evidences her array of decarceration expertise."], "Eddie Ellis": ["Eddie Ellis is the Co-Director of Outreach and Community Care Programs. He joined the CFSY team in early 2018. He works with ICAN members across the country, connecting them to each other and with local resources. He also works with other directly impacted communities, including the family members of juvenile lifers.", "Eddie, a native Washingtonian, was arrested and charged with murder at the age of 16 -- he was later found guilty of manslaughter and sentenced to 22 years in prison. He served 15 years and finished the rest of his time on parole.", "Eddie came home in 2006 and since that time he has worked on a variety of issues, including reentry, solitary confinement, and on behalf of people with disabilities who are in the system and coming home. He has served on the board of directors of a national legal organization, and helped with client center training for lawyers, probation officers and social workers. He is an advocate for those in the system, a mentor, and a motivational speaker. His lived experience as a formerly incarcerated person provides invaluable insight and depth into his work that allows him to connect with and engage the community he serves."], "Jamila Hammami": ["Jamila Hammami is a Tunisian Texan grassroots organizer and border abolitionist scholar-activist with over twenty years of cross-movement work. A Frederick Douglass 200 Bicentennial Abolitionist Honoree (2019), Jamila serves as an organizer on Deportation Defense Campaigns (DDC) in New York State and is a member of the Clemency Coalition of New York (CCNY), where they are Principal Investigator on \"Beyond the Sentence,\" a Community-Led Policy Consultation on clemency and categorical clemency justice in NYS.", "Jamila is active in international anti-fascist struggles and education, focusing on radical decolonial pedagogies and praxis. An Opportunity Agenda and Sundance Creative Change alum, Jamila co-founded, produces, and hosts the decolonial podcast Resistant Communiqués, a multidisciplinary hub for People's and Resistance Oral Histories. Their scholarship spans border and carceral studies, community organizing, empire, and political economy. Jamila's recent work appears in Radical History Review (Duke University Press, 2023) and Resistance and Abolition in the Borderlands (University of Arizona Press, 2024). Previously, they were the founding executive director of the Queer Detainee Empowerment Project (QDEP), developing the first internationally recognized framework bridging prison abolition and immigrant justice. Their work was also honored by the International Detention Coalition (2016) as best practices for community-based alternatives to detention for LGBTQIA+ and PLHIV communities."], "Taylor Fox": ["Taylor Fox is an attorney, researcher, and organizer. She is currently a Legal Fellow with the Knight First Amendment Institute at Columbia University. Taylor is also active in international movement defense through the Coalition to End Zionist Repression, and locally through Palestine solidarity efforts in New York. Previously, Taylor worked as an attorney with the American Association for University Professors and as the Law and Organizing Fellow with the Law and Political Economy Project at Yale Law School.", "She graduated from UC Berkeley Law with Pro Bono Honors."], "Matyos Kidane": ["Matyos Kidane (any/all) is a community organizer of Tigrayan descent based in Los Angeles. For nearly a decade, Matyos has focused on addressing the intersections of police violence, houselessness, and poverty in Los Angeles. In recent years, this work has increasingly focused on building and sustaining autonomous networks of care led by communities experiencing historic and ongoing state violence. You can find Matyos’ writings on policing and surveillance in local and national publications including the LA Progressive and Vice News."], "Joseph Barrett": ["Joseph Barrett is a Principal at Community Justice Solutions (CJS), a venture of the Center for Justice Innovation. At Community Justice Solutions, Joe helps communities and jurisdictions adopt the next generation of justice policy and practice. He leads Rubber Meets Road, a partnership with the magazine Vital City to advance evidence-based but underutilized policies to improve public safety, as well as the Center's work to advance thoughtful and ethical uses for AI in criminal courts.", "Previously, Joe was the Project Director of Manhattan Justice Opportunities, where he led an interdisciplinary team that provided social services as alternatives to incarceration for thousands of people charged with misdemeanor and felony cases each year. In a prior role at the Center, he helped to plan and implement pre-arraignment diversion programs and court-based alternative sentencing programs across New York City. Before joining the Center for Justice Innovation, Joe worked at the Petey Greene Program—a non-profit that trains and coordinates volunteers to serve as tutors in correctional facilities—where he was responsible for expanding the program to Massachusetts and Rhode Island. He holds a bachelor’s degree in History from Princeton University and an MPhil in Economic and Social History from the University of Oxford."], "Maya Dimant": ["Maya Dimant is so excited to be back on Princeton's campus and is very grateful for the invitation- thank you, SPEAR! She is an Assistant Professor of Law and Director of Public Interest & Externships at Seton Hall University School of Law. Previously, she was a Lecturer/Clinical Fellow in the Program in Law & Public Policy at the Princeton School of Public & International Affairs and a Service Focus Faculty Fellow for the \"Criminally Unjust\" cohort. Her work focuses on racial justice and deconstructing the modern carceral state, sitting at the intersection of experiential pedagogy, law, alternative dispute resolution, and reenvisioning justice systems.", "Maya teaches experiential classes rooted in theory and policy where students learn and practice critical tools such as negotiation, mediation, restorative justice, oral and written advocacy, interviewing, and investigation through simulations, lived experience, and iterative feedback. She is passionate about developing creative pedagogical models for students learning advocacy and extrajudicial strategies to become bold decarceration visionaries. At Princeton, with the support of PLAW and ProCES, she built the first undergraduate legal services clinic that she is aware of. Three of the clinic's seven clients have secured reduced sentences and/or early releases from prison.", "She previously served as a Friedman Fellow/Co-director in the Prisoner and Reentry Clinic at George Washington University Law School, where she supervised students representing incarcerated people, and co-taught a seminar exploring how institutionalized white supremacy created the prison industrial complex. Prior to that, Maya was an Assistant Public Defender in Maryland, where she completed Gideon's Promise training and represented over 1,000 clients in misdemeanor and felony proceedings.", "Maya was also an Equal Justice Works Fellow, and is a trained mediator and restorative justice circle keeper. Maya holds a bachelor's degree in Sociology from Barnard College, as well as a J.D. and an LL.M in International Human Rights from Northwestern University."], "Beryl Lipton": ["Beryl Lipton is a Senior Investigative Researcher at the Electronic Frontier Foundation, where she covers the use of surveillance technologies by police and in the criminal justice system. She has extensive experience using public records in her research. Beryl is also the Police Discipline Data Coordinator for the New York papers of the USA Today Network, leading the effort to collect and make public records on police misconduct in New York. Beryl frequently educates students, journalists, and the public on the use of public records and police technology."], "Ijeoma Oluo": ["Ijeoma Oluo is a Seattle-based writer and speaker. She is the author of the #1 New York Times bestseller So You Want to Talk About Race, as well as Mediocre: The Dangerous Legacy of White Male America and Be a Revolution.", "Her writing on race, politics, and social justice has appeared in outlets including The Guardian, The Stranger, and Jezebel, and she served as an editor-at-large at The Establishment. She holds a B.A. in political science from Western Washington University, has twice been named to The Root 100, and has received the American Humanist Association’s 2018 Feminist Humanist Award and 2020 Harvard Humanist of the Year Award."], "Naomi Murakawa": ["Naomi Murakawa is an associate professor of African American Studies at Princeton University. Her research examines how racial inequality is reproduced in American politics, with a focus on crime policy and the carceral state.", "She is the author of The First Civil Right: How Liberals Built Prison America (Oxford University Press), which won the American Political Science Association’s Michael Harrington Book Award, and she edits the Abolitionist Papers book series at Haymarket Books. Murakawa holds a B.A. from Columbia University, an M.Sc. from the London School of Economics, and a Ph.D. in political science from Yale University, and previously taught at the University of Washington."], "Yeshimabeit Milner": ["Yeshimabeit “Yeshi” Milner is the founder and executive director of Data for Black Lives, a movement of scientists, activists, and organizers who use data science to create measurable change in Black communities. A technologist and movement builder who began organizing as a teenager in Miami, she co-founded the organization in 2017 with her Brown University classmate Lucas Mason-Brown.", "Data for Black Lives has helped reshape the national and global conversation on big data and technology, including through its annual conference and its call to “Abolish Big Data.” Milner serves on the board of the Highlander Research and Education Center, and she and her co-founders have been honored with recognition including Forbes 30 Under 30 and the New York Times 2020 Good Tech Awards."], "Aly Wane": ["Aly Wane is an immigrant human rights organizer based in Syracuse, New York, originally from Senegal. His organizing spans antiwar, economic, racial, and immigrant justice, and he serves on the Steering Committee of the Syracuse Peace Council.", "He has also worked with the Black Alliance for Just Immigration, the UndocuBlack Network, Black Lives Matter Syracuse, and the American Friends Service Committee, and is a graduate of Le Moyne College."], "Udi Ofer": ["Udi Ofer is the John L. Weinberg Visiting Professor and Lecturer of Public and International Affairs at Princeton’s School of Public and International Affairs, where he founded and directs the Policy Advocacy Clinic and teaches on civil rights, policing, criminal justice reform, and policy advocacy.", "Before joining Princeton full-time in 2022, he spent two decades as an attorney at the ACLU, including as executive director of the ACLU of New Jersey, deputy national political director, and founding director of the organization’s Justice Division. He chairs the International Advisory Council of the Association for Civil Rights in Israel and is an elected member of the Council on Criminal Justice. Ofer is a graduate of Fordham University School of Law and the State University of New York at Buffalo."]};
function bio(n){var b=B[n];return b?'<details><summary>Read bio</summary><div class="bio">'+b.map(function(t){return '<p>'+esc(t)+'</p>'}).join('')+'</div></details>':''}
function f(x){var a=x.split(":"),h=+a[0],m=a[1],s=h<12?"am":"pm";return (h%12||12)+":"+m+" "+s}

var now=new Date(),live=now.getFullYear()==2026&&now.getMonth()==10&&now.getDate()==14,
 mins=now.getHours()*60+now.getMinutes();
function mm(x){var a=x.split(":");return +a[0]*60+ +a[1]}
document.getElementById("sched").innerHTML=S.map(function(s){

  return '<section class="s'+(on?' now':'')+'" style="--c:'+s.c+'"><div class="meta"><span>'+time+'</span><span class="kind">'+s.k+'</span>'+(on?'<span class="badge">happening now</span>':'')+'</div>'
  +'<h3>'+esc(s.h)+'</h3><p class="sub">'+esc(s.sub)+'</p><p class="d">'+esc(s.d)+'</p><ul>'
  +s.p.map(function(p){var k=PK[p[0]];return '<li>'+(k?'<img src="'+P[k]+'" alt="'+esc(p[0])+'" width="64" height="64">':'')+'<div>'+esc(p[0])+'<small>'+esc(p[1])+'</small>'+bio(p[0])+'</div></li>'}).join("")+'</ul></section>';
}).join("");
